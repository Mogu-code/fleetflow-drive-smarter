services:
  db:
    image: postgres:15-alpine
    container_name: fleetflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-fleetflow}
    ports:
      - "5432:5432"
    volumes:
      - fleetflow_pgdata:/var/lib/postgresql/data

volumes:
  fleetflow_pgdata:
